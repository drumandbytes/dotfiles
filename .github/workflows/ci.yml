name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Per-job path filtering, not a workflow-level paths-ignore: the jobs
  # below care about disjoint file sets (shell scripts vs .tmpl templates
  # vs markdown), and a blanket ignore would wrongly skip markdownlint on
  # a shell-only change or vice versa. Each filter also matches this
  # workflow file itself, so editing the pipeline always re-runs everything.
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    outputs:
      shell: ${{ steps.filter.outputs.shell }}
      chezmoi: ${{ steps.filter.outputs.chezmoi }}
      md: ${{ steps.filter.outputs.md }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          filters: |
            shell:
              - 'install.sh'
              - '.chezmoiscripts/run_once_*.sh'
              - '.chezmoiscripts/run_onchange_*.sh'
              - '.github/workflows/ci.yml'
            chezmoi:
              - '**/*.tmpl'
              - '.github/workflows/ci.yml'
            md:
              - '**/*.md'
              - '.github/workflows/ci.yml'

  shellcheck:
    name: shellcheck
    needs: changes
    if: needs.changes.outputs.shell == 'true'
    runs-on: ubuntu-latest  # shellcheck is preinstalled on ubuntu runners
    steps:
      - uses: actions/checkout@v7
      - name: Run shellcheck
        run: shellcheck install.sh .chezmoiscripts/run_once_*.sh .chezmoiscripts/run_onchange_*.sh

  shfmt:
    name: shfmt
    needs: changes
    if: needs.changes.outputs.shell == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install shfmt
        run: brew install shfmt
      - name: Check formatting
        # -d prints a diff and exits non-zero if any file differs; -i 4 = 4-space indent
        run: shfmt -d -i 4 install.sh .chezmoiscripts/run_once_*.sh .chezmoiscripts/run_onchange_*.sh

  chezmoi-templates:
    name: chezmoi templates
    needs: changes
    if: needs.changes.outputs.chezmoi == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install chezmoi + shell linters
        run: brew install chezmoi shellcheck shfmt
      - name: Validate templates (minimal flags)
        # All flags off + non-fresh editor — matches .chezmoi.toml.tmpl fresh-install
        # defaults and exercises the false/else branches of every template.
        run: |
          mkdir -p ~/.config/chezmoi
          cat > ~/.config/chezmoi/chezmoi.toml << EOF
          sourceDir = "$(pwd)"
          [data]
            editor           = "vim"
            alt_tools        = false
            macos_utils      = false
            macos_cosmetic   = false
            macos_media      = false
            dev_apps         = false
            touchbar         = false
            gaming           = false
            productivity     = false
            peripherals      = false
            onepassword      = false
            touch_id_sudo    = false
            docker           = false
            kubernetes       = false
            machine_excludes = []
          EOF

          failed=0
          # Skip .chezmoi.toml.tmpl — it uses promptBoolOnce which requires interaction
          while IFS= read -r f; do
            echo "→ $f"
            chezmoi execute-template < "$f" > /dev/null || { echo "FAILED: $f"; failed=1; }
          done < <(find . -name '*.tmpl' ! -name '.chezmoi.toml.tmpl' ! -path './.git/*')
          exit "$failed"

      - name: Validate templates (all flags enabled)
        run: |
          cat > ~/.config/chezmoi/chezmoi.toml << EOF
          sourceDir = "$(pwd)"
          [data]
            editor           = "fresh"
            alt_tools        = true
            macos_utils      = true
            macos_cosmetic   = true
            macos_media      = true
            dev_apps         = true
            touchbar         = true
            gaming           = true
            productivity     = true
            peripherals      = true
            onepassword      = true
            touch_id_sudo    = true
            docker           = true
            kubernetes       = true
            machine_excludes = []
          EOF

          failed=0
          while IFS= read -r f; do
            echo "→ $f"
            chezmoi execute-template < "$f" > /dev/null || { echo "FAILED: $f"; failed=1; }
          done < <(find . -name '*.tmpl' ! -name '.chezmoi.toml.tmpl' ! -path './.git/*')
          exit "$failed"

      - name: Validate excludes take effect
        # Renders the Brewfile with a known exclude set and asserts excluded packages
        # are absent. Guards the contract that machine_excludes actually gates packages.
        run: |
          cat > ~/.config/chezmoi/chezmoi.toml << EOF
          sourceDir = "$(pwd)"
          [data]
            editor           = "vim"
            alt_tools        = true
            docker           = true
            kubernetes       = true
            dev_apps         = true
            macos_utils      = false
            macos_cosmetic   = false
            macos_media      = false
            touchbar         = false
            gaming           = false
            productivity     = false
            peripherals      = false
            onepassword      = true
            touch_id_sudo    = false
            machine_excludes = ["eza", "bat", "docker", "helm", "gh"]
          EOF

          rendered=$(chezmoi execute-template < dot_Brewfile.tmpl)
          failed=0
          for pkg in eza bat docker helm gh; do
            if echo "$rendered" | grep -qE "\"$pkg\""; then
              echo "FAILED: '$pkg' is in machine_excludes but still appears in rendered Brewfile"
              failed=1
            fi
          done
          # Sanity: non-excluded packages should be present
          for pkg in fd ripgrep kubernetes-cli kubecolor; do
            if ! echo "$rendered" | grep -qE "\"$pkg\""; then
              echo "FAILED: '$pkg' should be in rendered Brewfile but is missing"
              failed=1
            fi
          done
          exit "$failed"

      - name: Lint rendered .sh.tmpl scripts
        # Render with all infra flags on so scripts are fully expanded (no early-exit stubs).
        run: |
          cat > ~/.config/chezmoi/chezmoi.toml << EOF
          sourceDir = "$(pwd)"
          [data]
            editor         = "fresh"
            alt_tools      = true
            macos_utils    = true
            macos_cosmetic = true
            macos_media    = true
            dev_apps       = true
            touchbar       = false
            gaming         = false
            productivity   = false
            peripherals    = false
            onepassword    = true
            touch_id_sudo  = false
            docker         = true
            kubernetes     = true
            machine_excludes = []
          EOF

          failed=0
          while IFS= read -r f; do
            rendered=$(chezmoi execute-template < "$f")
            echo "→ shellcheck: $f"
            echo "$rendered" | shellcheck - || { echo "FAILED (shellcheck): $f"; failed=1; }
            echo "→ shfmt: $f"
            echo "$rendered" | shfmt -d -i 4 - || { echo "FAILED (shfmt): $f"; failed=1; }
          done < <(find .chezmoiscripts -name '*.sh.tmpl')
          exit "$failed"

  markdownlint:
    name: markdownlint
    needs: changes
    if: needs.changes.outputs.md == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: "**/*.md"
